name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: infra-mutate-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: 1.12.2
  TG_VERSION: 0.72.6

jobs:
  destroy:
    name: Destroy Infra
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tf_path: terraform

      - name: Destroy all infra
        working-directory: infra/live/${{ inputs.environment }}
        shell: bash
        run: terragrunt run-all destroy --terragrunt-non-interactive --terragrunt-exclude-dir aws/oidc

      - name: Write destroy summary
        shell: bash
        run: |
          {
            echo "## Destroy Summary"
            echo
            echo "- \`environment\`: \`${{ inputs.environment }}\`"
            echo "- command: \`terragrunt run-all destroy --terragrunt-non-interactive --terragrunt-exclude-dir aws/oidc\`"
            echo "- retained stack: \`aws/oidc\`"
          } >> "$GITHUB_STEP_SUMMARY"
