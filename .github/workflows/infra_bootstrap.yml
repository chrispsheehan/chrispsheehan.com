name: Infra Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: environment reference i.e. 'prod' or 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
      infra_version:
        description: "Version of infrastructure (terraform) to be applied"
        required: true
        default: main
        type: string

concurrency:
  group: infra-mutate-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_bootstrap: "true"
  TF_VERSION: 1.12.2
  TG_VERSION: 0.72.6

jobs:
  bootstrap_infra:
    name: Bootstrap Infra
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.infra_version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tf_path: terraform

      - name: Apply all bootstrap infra
        working-directory: infra/live/${{ inputs.environment }}
        shell: bash
        run: terragrunt run-all apply --terragrunt-non-interactive

      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "## Infra Bootstrap Summary"
            echo
            echo "- \`environment\`: \`${{ inputs.environment }}\`"
            echo "- \`infra_version\`: \`${{ inputs.infra_version }}\`"
            echo "- first command: \`terragrunt run-all apply --terragrunt-non-interactive --terragrunt-include-dir aws/code_bucket\`"
            echo "- second command: \`terragrunt run-all apply --terragrunt-non-interactive\`"
            echo "- reason: \`aws/code_bucket\` publishes the shared bootstrap Lambda zip used by `log_processor` and `cost_explorer`."
          } >> "$GITHUB_STEP_SUMMARY"
