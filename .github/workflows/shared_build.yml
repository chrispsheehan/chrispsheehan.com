name: Shared Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      frontend_version:
        required: true
        type: string
      lambda_version:
        required: true
        type: string
    outputs:
      code_bucket:
        description: "Bucket containing build artifacts"
        value: ${{ jobs.bucket.outputs.code_bucket_name }}
      frontend_version:
        description: "Resolved frontend version"
        value: ${{ inputs.frontend_version }}
      lambda_version:
        description: "Resolved lambda version"
        value: ${{ inputs.lambda_version }}

concurrency:
  group: build-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: 1.12.2
  TG_VERSION: 0.72.6

jobs:
  bucket:
    name: Code Bucket
    runs-on: ubuntu-24.04
    outputs:
      code_bucket_name: ${{ steps.get_bucket_name.outputs.bucket }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tf_path: terraform

      - name: Read Lambda artifact dir
        id: lambda_artifact_dir
        uses: ./.github/actions/just
        with:
          justfile_path: scripts/ci/justfile
          just_action: code-bucket-get-lambda-artifact-dir

      - name: Read AppSpec artifact dir
        id: appspec_artifact_dir
        uses: ./.github/actions/just
        with:
          justfile_path: scripts/ci/justfile
          just_action: code-bucket-get-appspec-artifact-dir

      - name: Apply build artifact bucket
        env:
          TF_VAR_lambda_artifact_dir: ${{ steps.lambda_artifact_dir.outputs.just_outputs }}
          TF_VAR_appspec_artifact_dir: ${{ steps.appspec_artifact_dir.outputs.just_outputs }}
        working-directory: infra/live/${{ inputs.environment }}/aws/code_bucket
        shell: bash
        run: terragrunt apply --terragrunt-non-interactive -auto-approve

      - name: Get bucket name
        id: get_bucket_name
        working-directory: infra/live/${{ inputs.environment }}/aws/code_bucket
        shell: bash
        run: |
          bucket="$(terragrunt output -raw bucket || true)"
          if [[ -z "$bucket" ]]; then
            echo "::error title=Missing code bucket output::infra/live/${{ inputs.environment }}/aws/code_bucket did not expose Terraform output 'bucket'. Apply that stack before publishing build artifacts."
            exit 1
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: bucket
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.frontend_version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend
        uses: ./.github/actions/just
        env:
          BUCKET_NAME: ${{ needs.bucket.outputs.code_bucket_name }}
          VERSION: ${{ inputs.frontend_version }}
        with:
          justfile_path: scripts/deploy/justfile
          just_action: frontend-build frontend-upload

  log-processor:
    name: Log Processor
    needs: bucket
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload log processor
        uses: ./.github/actions/just
        env:
          BUCKET_NAME: ${{ needs.bucket.outputs.code_bucket_name }}
          VERSION: ${{ inputs.lambda_version }}
          LAMBDA_SOURCE_DIR: lambdas/log_processor
          LAMBDA_ARTIFACT_NAME: log_processor
        with:
          justfile_path: scripts/deploy/justfile
          just_action: lambda-build lambda-upload

  cost-explorer:
    name: Cost Explorer
    needs: bucket
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload cost explorer
        uses: ./.github/actions/just
        env:
          BUCKET_NAME: ${{ needs.bucket.outputs.code_bucket_name }}
          VERSION: ${{ inputs.lambda_version }}
          LAMBDA_SOURCE_DIR: lambdas/cost_explorer
          LAMBDA_ARTIFACT_NAME: cost_explorer
        with:
          justfile_path: scripts/deploy/justfile
          just_action: lambda-build lambda-upload
